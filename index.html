<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat public — MiniMail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f1220 0%, #1e1b4b 100%);
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============ AUTH ============ */
  .auth-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f1220 0%, #1e1b4b 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000; overflow-y: auto;
  }
  .auth-card {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px; padding: 40px 36px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    animation: pop .4s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .auth-logo {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: grid; place-items: center;
    margin: 0 auto 20px; font-size: 30px;
    box-shadow: 0 8px 24px rgba(99,102,241,.4);
  }
  .auth-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .auth-subtitle { font-size: 13.5px; text-align: center; color: rgba(255,255,255,.6); margin-bottom: 28px; }
  .auth-tabs { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.2); border-radius: 12px; margin-bottom: 24px; }
  .auth-tab {
    flex: 1; padding: 9px; border-radius: 9px;
    font-size: 13.5px; font-weight: 600;
    color: rgba(255,255,255,.6);
    background: none; border: none; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .auth-tab.active { background: rgba(255,255,255,.1); color: #fff; }
  .auth-form { display: none; flex-direction: column; gap: 14px; }
  .auth-form.active { display: flex; }
  .auth-form input {
    width: 100%; padding: 14px 16px;
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 12px; color: #fff; font-size: 14px;
    font-family: inherit; outline: none; transition: all .2s;
  }
  .auth-form input:focus { border-color: #6366f1; background: rgba(255,255,255,.1); }
  .auth-btn {
    padding: 14px; background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    font-family: inherit; cursor: pointer;
    transition: all .2s; margin-top: 4px;
  }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,.4); }
  .auth-error { color: #ef4444; font-size: 12.5px; text-align: center; min-height: 16px; font-weight: 500; }

  /* ============ CHAT ============ */
  header {
    background: rgba(255,255,255,.06);
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(20px);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lock-badge {
    font-size: 11px; padding: 3px 10px;
    background: rgba(239,68,68,.2);
    color: #f87171;
    border-radius: 6px;
    font-weight: 800;
    letter-spacing: .04em;
    display: none;
  }
  .lock-badge.show { display: inline-block; }
  .user-info {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; padding: 6px 12px 6px 6px;
    background: rgba(255,255,255,.06);
    border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .user-avatar-small {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    border: 2px solid transparent;
  }
  .user-avatar-small:hover {
    transform: scale(1.1);
    box-shadow: 0 0 0 2px rgba(99,102,241,.6);
    border-color: #6366f1;
  }
  .user-avatar-small img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
  }
  .admin-badge {
    font-size: 9px; padding: 2px 7px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    border-radius: 4px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .admin-btn {
    padding: 6px 12px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; border: none; border-radius: 8px;
    font-size: 11px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .admin-btn:hover { transform: translateY(-1px); }
  .logout-btn {
    padding: 4px 10px;
    background: rgba(239,68,68,.15);
    color: #ef4444; border: none;
    border-radius: 6px; font-size: 11px;
    font-weight: 700; cursor: pointer;
    font-family: inherit; margin-left: 4px;
  }
  .logout-btn:hover { background: rgba(239,68,68,.25); }

  .pinned-announcement {
    background: linear-gradient(135deg, #7c2d12, #b91c1c);
    border-bottom: 2px solid #fbbf24;
    padding: 14px 24px;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    animation: slideDown .3s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .pinned-announcement.show { display: flex; }
  .pinned-announcement .pin-icon { font-size: 20px; flex-shrink: 0; }
  .pinned-announcement .pin-content { flex: 1; font-weight: 600; line-height: 1.4; }
  .pinned-announcement .pin-close {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 28px; height: 28px; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-size: 14px; flex-shrink: 0;
  }
  .pinned-announcement .pin-close:hover { background: rgba(255,255,255,.3); }

  #messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 70%; padding: 10px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    animation: msgIn .25s cubic-bezier(.16,1,.3,1);
    position: relative; display: flex; gap: 10px; align-items: flex-start;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.mine {
    align-self: flex-end; flex-direction: row-reverse;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none;
  }
  .msg.admin-msg {
    background: linear-gradient(135deg, #7c2d12, #b91c1c);
    border: 1px solid #fbbf24;
    box-shadow: 0 0 20px rgba(245,158,11,.25);
  }
  .msg.admin-msg.mine { background: linear-gradient(135deg, #b91c1c, #7c2d12); }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px;
    flex-shrink: 0; color: #fff; text-transform: uppercase;
    overflow: hidden;
  }
  .msg-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
  }
  .msg.admin-msg .msg-avatar { box-shadow: 0 0 0 2px #fbbf24; }
  .msg-body { min-width: 0; }
  .msg .author {
    font-size: 11px; font-weight: 700;
    opacity: .85; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: .05em;
    display: flex; align-items: center; gap: 6px;
  }
  .msg .author .tag-admin {
    font-size: 9px; padding: 1px 6px;
    background: #fbbf24; color: #7c2d12;
    border-radius: 4px; font-weight: 800;
  }
  .msg .content { font-size: 14px; line-height: 1.5; word-break: break-word; }
  .msg .time { font-size: 10px; opacity: .5; margin-top: 4px; text-align: right; }

  /* Image dans un message */
  .msg-image {
    max-width: 280px;
    max-height: 280px;
    border-radius: 10px;
    margin-top: 6px;
    cursor: pointer;
    transition: transform .2s;
    display: block;
    object-fit: cover;
  }
  .msg-image:hover { transform: scale(1.02); }
  .msg.mine .msg-image { margin-left: auto; }

  .msg-delete {
    position: absolute; top: 6px; right: 8px;
    background: rgba(0,0,0,.4); color: #fff;
    border: none; width: 22px; height: 22px;
    border-radius: 50%; font-size: 12px;
    cursor: pointer; opacity: 0; transition: opacity .2s;
    display: grid; place-items: center; font-family: inherit;
  }
  .msg:hover .msg-delete { opacity: 1; }
  .msg-delete:hover { background: #ef4444; }

  form {
    display: flex; gap: 10px; padding: 16px 24px;
    background: rgba(255,255,255,.06);
    border-top: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(20px); align-items: center;
  }
  #message {
    flex: 1; padding: 12px 16px;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 12px; color: #fff;
    font-size: 14px; font-family: inherit; outline: none;
  }
  #message:focus { border-color: #6366f1; }
  #message:disabled { opacity: .5; cursor: not-allowed; }
  .emoji-btn, .photo-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.15);
    color: #fff; font-size: 20px;
    cursor: pointer; flex-shrink: 0; transition: all .2s;
    display: grid; place-items: center;
    padding: 0; line-height: 1;
    overflow: hidden;
  }
  .emoji-btn:hover, .photo-btn:hover { background: rgba(255,255,255,.15); }
  .emoji-picker {
    position: absolute; bottom: 90px; right: 24px;
    background: #1e1b4b; border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px; padding: 12px;
    display: none; grid-template-columns: repeat(8, 1fr);
    gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 100; max-width: 380px; max-height: 300px; overflow-y: auto;
  }
  .emoji-picker.open { display: grid; }
  .emoji-picker span { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 6px; text-align: center; transition: background .15s; }
  .emoji-picker span:hover { background: rgba(255,255,255,.1); }
  button[type="submit"] {
    padding: 0 24px; height: 44px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    font-family: inherit; cursor: pointer;
    transition: transform .15s; flex-shrink: 0;
  }
  button[type="submit"]:hover:not(:disabled) { transform: translateY(-2px); }
  button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; }
  .empty { text-align: center; color: rgba(255,255,255,.4); margin-top: 40px; font-size: 14px; }

  .admin-popup {
    position: fixed; bottom: 100px; right: 24px;
    background: linear-gradient(135deg, #7c2d12, #b91c1c);
    border: 1px solid #fbbf24;
    padding: 12px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    display: none; animation: pop .3s ease; z-index: 500;
    max-width: 400px;
  }
  .admin-popup.show { display: block; }

  .global-popup {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-150%);
    background: linear-gradient(135deg, #7c2d12, #b91c1c);
    border: 2px solid #fbbf24;
    padding: 18px 28px; border-radius: 16px;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    z-index: 999; max-width: 500px;
    transition: transform .4s cubic-bezier(.16,1,.3,1);
    text-align: center;
  }
  .global-popup.show { transform: translateX(-50%) translateY(0); }
  .global-popup .popup-icon { font-size: 28px; margin-bottom: 6px; display: block; }

  /* ============ MODAL PHOTO DE PROFIL ============ */
  .avatar-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1100;
  }
  .avatar-modal.open { display: flex; }
  .avatar-modal-content {
    background: linear-gradient(135deg, #1a1f3a 0%, #2a1f3a 100%);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    text-align: center;
    animation: pop .3s cubic-bezier(.16,1,.3,1);
  }
  .avatar-modal-content h2 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 20px;
  }
  .avatar-preview-large {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    font-size: 56px;
    font-weight: 800;
    color: #fff;
    text-transform: uppercase;
    border: 4px solid rgba(255,255,255,.2);
    background-size: cover;
    background-position: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .avatar-preview-large img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .avatar-modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .avatar-modal-actions button {
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }
  .avatar-modal-actions .btn-upload {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
  }
  .avatar-modal-actions .btn-upload:hover { transform: translateY(-2px); }
  .avatar-modal-actions .btn-remove {
    background: rgba(239,68,68,.15);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,.3);
  }
  .avatar-modal-actions .btn-remove:hover { background: #ef4444; color: #fff; }
  .avatar-modal-actions .btn-cancel {
    background: rgba(255,255,255,.1);
    color: #fff;
  }
  .avatar-modal-actions .btn-cancel:hover { background: rgba(255,255,255,.2); }
  .avatar-hint {
    font-size: 12px;
    color: rgba(255,255,255,.5);
    margin-top: 16px;
  }

  /* ============ MODAL IMAGE (zoom) ============ */
  .image-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1200;
    cursor: zoom-out;
  }
  .image-modal.open { display: flex; }
  .image-modal img {
    max-width: 95vw;
    max-height: 95vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.8);
    animation: pop .3s cubic-bezier(.16,1,.3,1);
  }
  .image-modal-close {
    position: absolute;
    top: 20px; right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: none; color: #fff;
    font-size: 20px; cursor: pointer;
    display: grid; place-items: center;
    font-family: inherit;
    transition: all .2s;
  }
  .image-modal-close:hover { background: rgba(255,255,255,.3); }

  /* Prévisualisation de l'image avant envoi */
  .image-preview {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(200px);
    background: #1e1b4b;
    border: 2px solid rgba(99,102,241,.5);
    border-radius: 16px;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    z-index: 500;
    transition: transform .35s cubic-bezier(.16,1,.3,1);
    max-width: 90vw;
  }
  .image-preview.show {
    transform: translateX(-50%) translateY(0);
    display: flex;
  }
  .image-preview img {
    max-width: 250px;
    max-height: 250px;
    border-radius: 10px;
    object-fit: cover;
    align-self: center;
  }
  .image-preview-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .image-preview-actions button {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }
  .image-preview-actions .btn-cancel-img {
    background: rgba(239,68,68,.15);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,.3);
  }
  .image-preview-actions .btn-cancel-img:hover { background: #ef4444; color: #fff; }
  .image-preview-actions .btn-send-img {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
  }
  .image-preview-actions .btn-send-img:hover { transform: translateY(-1px); }

  /* ============ PANNEAU ADMIN ============ */
  .admin-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 440px; max-width: 100vw;
    background: linear-gradient(135deg, #1a1f3a 0%, #2a1f3a 100%);
    border-left: 1px solid rgba(255,255,255,.1);
    box-shadow: -10px 0 40px rgba(0,0,0,.5);
    z-index: 900; display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.16,1,.3,1);
    overflow: hidden;
  }
  .admin-panel.open { transform: translateX(0); }
  .admin-panel-header {
    padding: 20px 24px;
    background: linear-gradient(135deg, #7c2d12, #b91c1c);
    border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; gap: 12px;
  }
  .admin-panel-header h2 { font-size: 17px; font-weight: 800; flex: 1; }
  .admin-panel-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,.1);
    border: none; color: #fff; font-size: 16px;
    cursor: pointer; display: grid; place-items: center;
    font-family: inherit;
  }
  .admin-panel-close:hover { background: rgba(255,255,255,.2); }
  .admin-panel-tabs {
    display: flex; padding: 0 16px; gap: 4px;
    background: rgba(0,0,0,.2);
    border-bottom: 1px solid rgba(255,255,255,.1);
    overflow-x: auto;
  }
  .admin-panel-tab {
    padding: 12px 16px; font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,.5); background: none; border: none;
    cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all .2s; white-space: nowrap;
  }
  .admin-panel-tab.active { color: #fff; border-bottom-color: #fbbf24; }
  .admin-panel-body { flex: 1; overflow-y: auto; padding: 16px; }

  .admin-section-title {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: rgba(255,255,255,.4);
    font-weight: 700; padding: 8px 4px;
  }

  .user-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; margin-bottom: 8px;
    transition: all .2s;
    flex-wrap: wrap;
  }
  .user-row:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
  .user-row.banned { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); }
  .user-row.muted { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); }

  .user-row-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px;
    text-transform: uppercase; color: #fff; flex-shrink: 0;
    overflow: hidden;
  }
  .user-row-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  }
  .user-row-info { flex: 1; min-width: 0; }
  .user-row-name {
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .user-row-name .tag {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  }
  .user-row-name .tag.admin { background: linear-gradient(135deg, #ef4444, #f59e0b); color: #fff; }
  .user-row-name .tag.banned { background: #ef4444; color: #fff; }
  .user-row-name .tag.muted { background: #f59e0b; color: #000; }
  .user-row-meta { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }

  .user-row-actions {
    display: flex; gap: 6px; flex-shrink: 0;
    flex-wrap: wrap; width: 100%;
    margin-top: 6px;
    padding-top: 8px;

<script>
const SUPABASE_URL = "https://qqxucvjlwtrenfrrlvgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_yQXdPxGshaxHofMKgirgYg_omFshgvx";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORAGE_KEY = "chat_user";

// ==================== HELPERS ====================
function hashPassword(pwd) {
  return btoa(unescape(encodeURIComponent("mm#" + pwd)));
}
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = String(s ?? "");
  return d.innerHTML;
}
function formatDate(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function formatTime(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}
function isMuted(user) {
  if (!user || !user.muted_until) return false;
  return new Date(user.muted_until) > new Date();
}
function mutedTimeLeft(user) {
  if (!isMuted(user)) return "";
  const diff = new Date(user.muted_until) - new Date();
  const min = Math.ceil(diff / 60000);
  return min + " min";
}

const COLORS = ["#6366f1", "#8b5cf6", "#ec4899", "#f59e0b", "#10b981", "#06b6d4", "#ef4444", "#84cc16", "#f97316", "#a855f7"];
function colorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

function renderAvatarInElement(el, pseudo, avatarData) {
  if (!el) return;
  if (avatarData) {
    el.textContent = "";
    el.style.background = "transparent";
    el.innerHTML = `<img src="${avatarData}" alt="${escapeHtml(pseudo)}" />`;
  } else {
    el.innerHTML = "";
    el.textContent = pseudo.charAt(0).toUpperCase();
    el.style.background = colorFor(pseudo);
  }
}

// ==================== ÉTAT ====================
let CURRENT_USER = null;
let ADMIN_TAB = "users";
let ALL_USERS = [];
let CHAT_SETTINGS = { pinned_message: "", chat_locked: "false", global_popup: "", global_popup_at: "0" };
let POPUP_SHOWN_AT = 0;
let pendingImage = null;

const tabRegister = document.getElementById("tabRegister");

const imagePreviewImg = document.getElementById("imagePreviewImg");

// ==================== AUTH ====================
tabLogin.addEventListener("click", () => {
  tabLogin.classList.add("active"); tabRegister.classList.remove("active");
  loginForm.classList.add("active"); registerForm.classList.remove("active");
});
tabRegister.addEventListener("click", () => {
  tabRegister.classList.add("active"); tabLogin.classList.remove("active");
  registerForm.classList.add("active"); loginForm.classList.remove("active");
});

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  regError.textContent = "";
  const pseudo = document.getElementById("regPseudo").value.trim();
  const pwd = document.getElementById("regPassword").value;
  const pwd2 = document.getElementById("regPassword2").value;

  if (!pseudo || pseudo.length < 2) { regError.textContent = "Pseudo trop court (min 2)."; return; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(pseudo)) { regError.textContent = "Pseudo : lettres, chiffres, . _ -"; return; }
  if (pseudo.toLowerCase() === "admin") { regError.textContent = "Ce pseudo est réservé."; return; }
  if (pwd.length < 4) { regError.textContent = "Mot de passe trop court (min 4)."; return; }
  if (pwd !== pwd2) { regError.textContent = "Les mots de passe ne correspondent pas."; return; }

  const { data: existing } = await sb.from("chat_users").select("id, is_banned").eq("pseudo", pseudo).maybeSingle();
  if (existing) {
    regError.textContent = existing.is_banned ? "Ce pseudo est bloqué par un administrateur." : "Ce pseudo est déjà pris.";
    return;
  }

  const { data, error } = await sb.from("chat_users").insert({
    pseudo, password_hash: hashPassword(pwd), is_admin: false,
  }).select().single();

  if (error) { regError.textContent = "Erreur : " + error.message; return; }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  CURRENT_USER = data;
  enterChat();
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  const pseudo = document.getElementById("loginPseudo").value.trim();
  const pwd = document.getElementById("loginPassword").value;

  if (!pseudo || !pwd) { loginError.textContent = "Remplis tous les champs."; return; }

  const { data, error } = await sb.from("chat_users").select("*").eq("pseudo", pseudo).maybeSingle();
  if (error || !data) { loginError.textContent = "Pseudo ou mot de passe incorrect."; return; }
  if (data.password_hash !== hashPassword(pwd)) { loginError.textContent = "Pseudo ou mot de passe incorrect."; return; }
  if (data.is_banned) { loginError.textContent = "🚫 Ton compte a été bloqué par un administrateur."; return; }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  CURRENT_USER = data;
  enterChat();
});

  localStorage.removeItem(STORAGE_KEY);
  CURRENT_USER = null;
  chatContainer.style.display = "none";
  authScreen.style.display = "flex";
  loginForm.reset(); registerForm.reset();
});

// ==================== ENTRÉE ====================
async function enterChat() {
  authScreen.style.display = "none";
  chatContainer.style.display = "flex";
  renderAvatarInElement(myAvatar, CURRENT_USER.pseudo, CURRENT_USER.avatar);
  myPseudoEl.textContent = CURRENT_USER.pseudo;
  adminBadge.style.display = CURRENT_USER.is_admin ? "inline-block" : "none";
  adminPanelBtn.style.display = CURRENT_USER.is_admin ? "inline-block" : "none";

  await loadAllUsersPublic();
  await loadSettings();
  loadMessages();
  messageInput.focus();
}

async function loadAllUsersPublic() {
  const { data } = await sb.from("chat_users").select("id, pseudo, avatar, is_admin");

// ==================== RENDER MESSAGE ====================
function renderMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.id = msg.id;
  const isMine = CURRENT_USER && msg.auteur.toLowerCase() === CURRENT_USER.pseudo.toLowerCase();
  const isAdminMsg = (msg.auteur || "").toLowerCase() === "admin";

  if (isMine) div.classList.add("mine");
  if (isAdminMsg) div.classList.add("admin-msg");

  const time = formatTime(msg.created_at);
  const color = isAdminMsg ? "#fbbf24" : colorFor(msg.auteur);
  const canDelete = isMine || (CURRENT_USER && CURRENT_USER.is_admin);

  const authorUser = ALL_USERS.find(u => u.pseudo === msg.auteur);
  const authorAvatar = authorUser ? authorUser.avatar : null;
  const avatarHTML = authorAvatar
    ? `<img src="${authorAvatar}" alt="${escapeHtml(msg.auteur)}" />`
    : escapeHtml((msg.auteur || "?").charAt(0).toUpperCase());

  const imageHTML = msg.image
    ? `<img class="msg-image" src="${msg.image}" alt="Photo" data-img="${msg.image}" />`
    : "";

  div.innerHTML = `
    <div class="msg-avatar" style="background:${color}">${avatarHTML}</div>
    <div class="msg-body">
      <div class="author">
        ${escapeHtml(msg.auteur)}
        ${isAdminMsg ? '<span class="tag-admin">Admin</span>' : ''}
      </div>
      ${msg.contenu ? `<div class="content">${escapeHtml(msg.contenu)}</div>` : ''}
      ${imageHTML}
      <div class="time">${time}</div>
    </div>
    ${canDelete ? '<button class="msg-delete" title="Supprimer">✕</button>' : ''}
  `;

  if (canDelete) {
    div.querySelector(".msg-delete").addEventListener("click", async (e) => {
      e.stopPropagation();
      const isAdminDelete = CURRENT_USER.is_admin && !isMine;
      const confirmMsg = isAdminDelete ? `🛡️ Supprimer le message de ${msg.auteur} ?` : "Supprimer ce message ?";
      if (!confirm(confirmMsg)) return;
      await sb.from("messages").delete().eq("id", msg.id);
    });
  }

  const imgEl = div.querySelector(".msg-image");
  if (imgEl) {
    imgEl.addEventListener("click", (e) => {
      e.stopPropagation();
      openImageModal(imgEl.src);
    });
  }

  messagesEl.appendChild(div);
}

sb.channel("messages-live")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
    const empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();
    renderMessage(payload.new);
    scrollBottom();

    if (isAdminMsg && !isMine) showAdminPopup("🛡️ Message administrateur");
    if (!isMine) playNotif();
  })
  .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, (payload) => {
    const el = messagesEl.querySelector(`[data-id="${payload.old.id}"]`);
    if (el) el.remove();
  })
  .subscribe();

sb.channel("users-live")
  .on("postgres_changes", { event: "UPDATE", schema: "public", table: "chat_users" }, (payload) => {
    if (CURRENT_USER && payload.new.id === CURRENT_USER.id) {
      if (payload.new.is_banned) {
        alert("🚫 Ton compte vient d'être bloqué. Tu vas être déconnecté.");
        localStorage.removeItem(STORAGE_KEY);
        CURRENT_USER = null;
        chatContainer.style.display = "none";

      CURRENT_USER = payload.new;

// ==================== SON ====================
function playNotif() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; gain.gain.value = 0.05;
    osc.start();
    setTimeout(() => osc.stop(), 100);
    osc.onended = () => ctx.close();
  } catch(e) {}
}

async function refreshAdminData() {
  const { data: users } = await sb.from("chat_users").select("*").order("created_at", { ascending: false });
  const { data: mails } = await sb.from("messages").select("auteur");
  const counts = {};
  (mails || []).forEach(m => { counts[m.auteur] = (counts[m.auteur] || 0) + 1; });
  ALL_USERS = (users || []).map(u => ({ ...u, messageCount: counts[u.pseudo] || 0 }));

function renderAdminUsers() {

  const muted = ALL_USERS.filter(u => isMuted(u)).length;

  let html = `

    const isAdmin = u.is_admin;
    const isBanned = u.is_banned;
    const isMutedUser = isMuted(u);
    const color = colorFor(u.pseudo);
    const avatarHTML = u.avatar
      ? `<img src="${u.avatar}" alt="${escapeHtml(u.pseudo)}" />`
      : escapeHtml(u.pseudo.charAt(0).toUpperCase());

    html += `
      <div class="user-row ${isBanned ? 'banned' : ''} ${isMutedUser ? 'muted' : ''}">

            ${isMutedUser ? `<span class="tag muted">Muté ${mutedTimeLeft(u)}</span>` : ''}

          <div class="user-row-meta">${u.messageCount} message${u.messageCount > 1 ? 's' : ''} · Inscrit le ${formatDate(u.created_at)}</div>
        </div>
        <div class="user-row-actions">

              : `<button class="admin-action-btn mute" data-mute="${u.id}">⏱️ Muter</button>`

    setSetting("global_popup", msg);
    setSetting("global_popup_at", Date.now().toString());
    document.getElementById("popupInput").value = "";
    showAdminPopup("🌐 Popup envoyée !");
  });
}

async function setSetting(key, value) {
  const { error } = await sb.from("chat_settings").upsert({ key, value, updated_at: new Date().toISOString() });
  if (error) { alert("Erreur : " + error.message); return; }
  CHAT_SETTINGS[key] = value;
  applySettings();
  if (ADMIN_TAB === "moderation") renderAdminModeration();
  showAdminPopup("✅ Enregistré");
}

async function banUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  const reason = prompt(`🚫 Bannir ${user.pseudo} ?\nRaison (optionnelle) :`, "");
  if (reason === null) return;
  const { error } = await sb.from("chat_users")
    .update({ is_banned: true, banned_at: new Date().toISOString(), banned_reason: reason || null })
    .eq("id", userId);
  if (error) { alert("Erreur : " + error.message); return; }
  await sb.from("messages").delete().eq("auteur", user.pseudo);
  showAdminPopup(`🚫 ${user.pseudo} a été banni`);
  await refreshAdminData();
}

async function unbanUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  if (!confirm(`✅ Débannir ${user.pseudo} ?`)) return;
  const { error } = await sb.from("chat_users")
    .update({ is_banned: false, banned_at: null, banned_reason: null })
    .eq("id", userId);
  if (error) { alert("Erreur : " + error.message); return; }
  showAdminPopup(`✅ ${user.pseudo} a été débanni`);
  await refreshAdminData();
}

async function muteUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  const minutes = prompt(`⏱️ Muter ${user.pseudo} pendant combien de minutes ?\n(Ex: 5, 10, 30, 60)`, "10");
  if (!minutes) return;
  const min = parseInt(minutes, 10);
  if (!min || min < 1) { alert("Nombre de minutes invalide."); return; }
  const until = new Date(Date.now() + min * 60000).toISOString();
  const { error } = await sb.from("chat_users").update({ muted_until: until }).eq("id", userId);
  if (error) { alert("Erreur : " + error.message); return; }
  showAdminPopup(`⏱️ ${user.pseudo} muté ${min} min`);
  await refreshAdminData();
}

async function unmuteUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  if (!confirm(`🔊 Démuter ${user.pseudo} ?`)) return;
  const { error } = await sb.from("chat_users").update({ muted_until: null }).eq("id", userId);
  if (error) { alert("Erreur : " + error.message); return; }
  showAdminPopup(`🔊 ${user.pseudo} démuté`);
  await refreshAdminData();
}

async function promoteUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  if (!confirm(`🎛️ Promouvoir ${user.pseudo} en administrateur ?\n\nIl pourra bannir, muter, verrouiller le chat, etc.`)) return;

  if (error) { alert("Erreur : " + error.message); return; }

async function demoteUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  if (!confirm(`⬇️ Rétrograder ${user.pseudo} ?\n\nIl perdra ses droits admin.`)) return;
  const { error } = await sb.from("chat_users").update({ is_admin: false }).eq("id", userId);
  if (error) { alert("Erreur : " + error.message); return; }
  showAdminPopup(`⬇️ ${user.pseudo} n'est plus admin`);

}

async function renameUser(userId) {
  const user = ALL_USERS.find(u => String(u.id) === String(userId));
  if (!user) return;
  const newPseudo = prompt(`✏️ Nouveau pseudo pour ${user.pseudo} :`, user.pseudo);
  if (!newPseudo || newPseudo === user.pseudo) return;
  const clean = newPseudo.trim();
  if (!/^[a-zA-Z0-9_.-]+$/.test(clean) || clean.length < 2) {
    alert("Pseudo invalide (lettres, chiffres, . _ -, min 2).");
    return;
  }
  if (clean.toLowerCase() === "admin") { alert("Pseudo réservé."); return; }

  const { data: existing } = await sb.from("chat_users").select("id").eq("pseudo", clean).maybeSingle();
  if (existing) { alert("Ce pseudo est déjà pris."); return; }

  if (!confirm(`✏️ Renommer ${user.pseudo} → ${clean} ?\n\nLes messages existants seront aussi renommés.`)) return;

  const { error: e1 } = await sb.from("chat_users").update({ pseudo: clean }).eq("id", userId);
  if (e1) { alert("Erreur : " + e1.message); return; }
  await sb.from("messages").update({ auteur: clean }).eq("auteur", user.pseudo);

  if (CURRENT_USER.id === user.id) {
    CURRENT_USER.pseudo = clean;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(CURRENT_USER));
    myPseudoEl.textContent = clean;
    myAvatar.textContent = clean.charAt(0).toUpperCase();
  }

  showAdminPopup(`✏️ Renommé en ${clean}`);
  await refreshAdminData();
}

function renderAdminStats() {
  const totalUsers = ALL_USERS.length;
  const bannedUsers = ALL_USERS.filter(u => u.is_banned).length;
  const adminUsers = ALL_USERS.filter(u => u.is_admin).length;
  const mutedUsers = ALL_USERS.filter(u => isMuted(u)).length;
  const totalMessages = ALL_USERS.reduce((s, u) => s + u.messageCount, 0);
  const topUsers = [...ALL_USERS].sort((a, b) => b.messageCount - a.messageCount).slice(0, 5);

  let html = `
    <div class="admin-stats">
      <div class="admin-stat"><div class="admin-stat-num">${totalUsers}</div><div class="admin-stat-label">Utilisateurs</div></div>
      <div class="admin-stat"><div class="admin-stat-num">${totalMessages}</div><div class="admin-stat-label">Messages</div></div>
      <div class="admin-stat"><div class="admin-stat-num">${bannedUsers}</div><div class="admin-stat-label">Bannis</div></div>
      <div class="admin-stat"><div class="admin-stat-num">${adminUsers}</div><div class="admin-stat-label">Admins</div></div>
      <div class="admin-stat"><div class="admin-stat-num">${mutedUsers}</div><div class="admin-stat-label">Mutés</div></div>
      <div class="admin-stat"><div class="admin-stat-num">${CHAT_SETTINGS.chat_locked === "true" ? "OUI" : "NON"}</div><div class="admin-stat-label">Verrouillé</div></div>
    </div>
    <div class="admin-section-title">🏆 Top contributeurs</div>
  `;

  if (topUsers.length === 0) {
    html += '<div class="admin-empty">Aucun message</div>';
  } else {
    topUsers.forEach((u, i) => {
      const medal = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"][i];
      html += `
        <div class="user-row">
          <div class="user-row-avatar" style="background:${colorFor(u.pseudo)}">${escapeHtml(u.pseudo.charAt(0).toUpperCase())}</div>
          <div class="user-row-info">
            <div class="user-row-name">${medal} ${escapeHtml(u.pseudo)}</div>
            <div class="user-row-meta">${u.messageCount} message${u.messageCount > 1 ? 's' : ''}</div>
          </div>
        </div>
      `;
    });
  }
  adminPanelBody.innerHTML = html;
}

// ==================== SESSION AUTO ====================
(async function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const u = JSON.parse(saved);
      const { data } = await sb.from("chat_users").select("*").eq("id", u.id).maybeSingle();
      if (data && !data.is_banned) {
        CURRENT_USER = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        enterChat();
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    } catch (e) {
      localStorage.removeItem(STORAGE_KEY);
    }
  }
})();
</script>

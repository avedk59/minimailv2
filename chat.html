<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat public — MiniMail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f1220 0%, #1e1b4b 100%);
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: rgba(255,255,255,.06);
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(20px);
  }
  header h1 {
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .status {
    margin-left: auto;
    font-size: 12px;
    padding: 4px 12px;
    background: rgba(16,185,129,.15);
    color: #10b981;
    border-radius: 999px;
    font-weight: 600;
  }
  header .status.offline {
    background: rgba(239,68,68,.15);
    color: #ef4444;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    animation: pop .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.mine {
    align-self: flex-end;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none;
  }
  .msg .author {
    font-size: 11px;
    font-weight: 700;
    opacity: .7;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .msg .content { font-size: 14px; line-height: 1.5; word-break: break-word; }
  .msg .time {
    font-size: 10px;
    opacity: .5;
    margin-top: 4px;
    text-align: right;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    background: rgba(255,255,255,.06);
    border-top: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(20px);
  }
  #pseudo {
    width: 130px;
    padding: 12px 14px;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  #pseudo:focus { border-color: #6366f1; }
  #message {
    flex: 1;
    padding: 12px 16px;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  #message:focus { border-color: #6366f1; }
  button {
    padding: 0 24px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  .empty {
    text-align: center;
    color: rgba(255,255,255,.4);
    margin-top: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>💬 Chat public — MiniMail</h1>
  <span class="status" id="status">Connexion...</span>
</header>

<div id="messages">
  <div class="empty">Chargement des messages...</div>
</div>

<form id="form">
  <input type="text" id="pseudo" placeholder="Ton pseudo" maxlength="20" required />
  <input type="text" id="message" placeholder="Écris un message..." maxlength="500" required autocomplete="off" />
  <button type="submit">Envoyer</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ REMPLACE CES 2 LIGNES PAR TES VRAIES VALEURS
const SUPABASE_URL = "https://qxucvwjlwtenrfrilvgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_lvCn3M12RhjbTdlLfx_esA_MBSXDEDZ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const messagesEl = document.getElementById("messages");
const statusEl = document.getElementById("status");
const form = document.getElementById("form");
const pseudoInput = document.getElementById("pseudo");
const messageInput = document.getElementById("message");

// Récupère le pseudo sauvegardé
pseudoInput.value = localStorage.getItem("chat_pseudo") || "";

// Charge les derniers messages
async function loadMessages() {
  const { data, error } = await sb
    .from("messages")
    .select("*")
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    console.error("Erreur:", error);
    statusEl.textContent = "Erreur";
    statusEl.classList.add("offline");
    return;
  }

  messagesEl.innerHTML = "";
  if (data.length === 0) {
    messagesEl.innerHTML = '<div class="empty">Aucun message. Sois le premier !</div>';
  } else {
    data.forEach(renderMessage);
  }
  scrollBottom();
  statusEl.textContent = "Connecté ✓";
  statusEl.classList.remove("offline");
}

function renderMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg";
  const pseudo = localStorage.getItem("chat_pseudo") || "?";
  if (msg.auteur === pseudo) div.classList.add("mine");
  const time = new Date(msg.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  div.innerHTML = `
    <div class="author">${escapeHtml(msg.auteur)}</div>
    <div class="content">${escapeHtml(msg.contenu)}</div>
    <div class="time">${time}</div>
  `;
  messagesEl.appendChild(div);
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// Envoi d'un message
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pseudo = pseudoInput.value.trim() || "Anonyme";
  const contenu = messageInput.value.trim();
  if (!contenu) return;

  localStorage.setItem("chat_pseudo", pseudo);
  messageInput.value = "";

  const { error } = await sb.from("messages").insert({ auteur: pseudo, contenu });
  if (error) {
    console.error("Erreur envoi:", error);
    alert("Erreur d'envoi : " + error.message);
  }
});

// Écoute les nouveaux messages en temps réel
sb.channel("messages-realtime")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
    const empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();
    renderMessage(payload.new);
    scrollBottom();
  })
  .subscribe();

// Charge au démarrage
loadMessages();

// Focus auto sur le champ message si pseudo déjà rempli
if (pseudoInput.value) {
  messageInput.focus();
}
</script>
</body>
</html>
